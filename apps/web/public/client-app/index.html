<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>VS System — 1:1 Mockup</title>
  <style>
    :root {
      --teal: #00ffc2;
      --muted: rgba(244, 247, 246, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #0a0c0f;
      color: #f4f7f6;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px 12px 28px;
    }
    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      max-width: 360px;
    }
    .hint strong { color: var(--teal); }
    .frame {
      width: min(100%, 420px);
      line-height: 0;
    }
    .frame img {
      width: 100%;
      height: auto;
      display: none;
      border-radius: 8px;
      user-select: none;
      -webkit-user-drag: none;
      cursor: pointer;
    }
    .frame img.on { display: block; }
    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav button {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 12px;
      cursor: pointer;
    }
    .nav button.on {
      background: var(--teal);
      color: #031410;
      border-color: var(--teal);
      font-weight: 700;
    }
    @media (max-width: 480px) {
      .stage { padding: 0; gap: 0; }
      .hint, .nav { display: none; }
      .frame { width: 100%; min-height: 100vh; min-height: 100dvh; }
      .frame img {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        object-fit: contain;
        background: #000;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="hint">
      <strong>1:1 mockup</strong> — tieši šis dizains, bez ekstra rāmja.<br />
      Spied attēlu = nākamais ekrāns.
    </p>

    <div class="frame" id="frame">
      <img class="on" id="img-faceid" src="./screens/faceid.png" alt="VS System Face ID" />
      <img id="img-home" src="./screens/home.png" alt="VS System Home" />
      <img id="img-chart" src="./screens/chart.png" alt="VS System Chart" />
      <img id="img-profile" src="./screens/profile.png" alt="VS System Profile" />
    </div>

    <div class="nav" id="nav">
      <button data-go="faceid" class="on">Face ID</button>
      <button data-go="home">Home</button>
      <button data-go="chart">Chart</button>
      <button data-go="profile">Profile</button>
    </div>
  </div>

  <script>
    const order = ["faceid", "home", "chart", "profile"];
    let i = 0;

    function show(id) {
      const idx = order.indexOf(id);
      if (idx < 0) return;
      i = idx;
      for (const s of order) {
        document.getElementById("img-" + s).classList.toggle("on", s === id);
      }
      document.querySelectorAll("#nav button").forEach((b) => {
        b.classList.toggle("on", b.dataset.go === id);
      });
    }

    document.getElementById("frame").addEventListener("click", () => {
      show(order[(i + 1) % order.length]);
    });
    document.getElementById("nav").addEventListener("click", (e) => {
      const b = e.target.closest("[data-go]");
      if (!b) return;
      e.stopPropagation();
      show(b.dataset.go);
    });
  </script>
</body>
</html>
